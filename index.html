<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eric Stimpson: research examples</title>
<style>
 body{font:16px/1.5 system-ui,sans-serif;max-width:1100px;margin:2rem auto;padding:0 1rem;color:#222}
 h1{margin-bottom:.2rem} .sub{color:#666;margin-top:0}
 #f button{margin:.2rem;padding:.3rem .8rem;border:1px solid #bbb;background:#fff;border-radius:1rem;cursor:pointer}
 #f button.on{background:#222;color:#fff}
 #g{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem;margin-top:1rem}
 a.c{display:block;border:1px solid #ddd;border-radius:8px;padding:1rem;color:inherit;text-decoration:none}
 a.c:hover{border-color:#888} a.c img{width:100%;border-radius:4px}
 .t{font-size:.8rem;color:#555} .b{display:inline-block;background:#eee;border-radius:4px;padding:0 .4rem;margin-right:.3rem}
</style></head><body>
<h1>Research examples</h1>
<p class="sub">Interactive simulations: phase-field crystal, DFT, MD, Monte Carlo. Most run live in your browser.</p>
<div id="f"></div><div id="g"></div>
<script>
fetch('examples.json').then(r=>r.json()).then(xs=>{
 xs=xs.filter(x=>x.status!=='retired');
 const g=document.getElementById('g'),f=document.getElementById('f');
 const draw=m=>{g.innerHTML='';xs.filter(x=>!m||(x.tags||[]).includes(m)).forEach(x=>{
  const be=[...new Set(x.variants.filter(v=>v.status==='active').map(v=>v.model))];
  g.insertAdjacentHTML('beforeend',`<a class="c" href="${x.href}">${x.thumb?`<img src="${x.thumb}" alt="" loading="lazy">`:''}
   <h3>${x.title}</h3><p>${x.blurb}</p><div class="t"><span class="b">${x.method}</span>${x.runtime}${be.length?' · models: '+be.join(', '):''}</div></a>`)})};
 const ms=[...new Set(xs.flatMap(x=>x.tags||[]))];
 [''].concat(ms).forEach(m=>{const b=document.createElement('button');b.textContent=m||'All';
  b.onclick=()=>{[...f.children].forEach(c=>c.classList.remove('on'));b.classList.add('on');draw(m)};f.append(b)});
 f.firstChild.classList.add('on');draw('');
});
</script></body></html>
